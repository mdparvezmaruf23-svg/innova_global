<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>INNOVA.GLOBAL</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at 20% 20%,rgba(132,56,180,.38),transparent 35%),
    radial-gradient(circle at 80% 70%,rgba(245,190,55,.22),transparent 35%),
    linear-gradient(135deg,#090516,#1b092d 45%,#08040e);
}

@keyframes softColors{
  0%{color:#f6d889}
  12%{color:#d8b4f0}
  25%{color:#eeaeca}
  38%{color:#8edee4}
  50%{color:#b8e29f}
  63%{color:#edaaaa}
  75%{color:#f0bb82}
  88%{color:#9ebdf2}
  100%{color:#f6d889}
}

.colorText{
  animation:softColors 9s linear infinite;
}

button{
  border:0;
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.page{
  min-height:100vh;
  padding:20px;
}

.card{
  width:min(720px,100%);
  margin:15px auto;
  padding:20px;
  border:1px solid rgba(255,255,255,.13);
  border-radius:18px;
  background:rgba(10,6,20,.72);
  backdrop-filter:blur(12px);
  box-shadow:0 10px 35px rgba(0,0,0,.35);
}

.logo{
  text-align:center;
  font-size:30px;
  font-weight:900;
  letter-spacing:2px;
}

.subtitle{
  text-align:center;
  margin:8px 0 20px;
  font-size:15px;
  opacity:.9;
}

.bismillah{
  text-align:center;
  font-size:23px;
  margin:10px 0 18px;
}

h1,h2,h3{
  animation:softColors 9s linear infinite;
}

input,select{
  width:100%;
  padding:13px 14px;
  margin:7px 0 12px;
  border-radius:11px;
  border:1px solid rgba(255,255,255,.16);
  outline:none;
  background:rgba(255,255,255,.07);
  color:#fff;
}

select option{
  background:#160c25;
  color:#fff;
}

label{
  font-size:13px;
  opacity:.85;
}

.btn{
  width:100%;
  padding:13px;
  border-radius:12px;
  color:#fff;
  font-weight:bold;
  margin:6px 0;
  background:linear-gradient(90deg,#a66bff,#f0b83f);
}

.btn:hover{
  opacity:.88;
}

.btn.secondary{
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.15);
}

.btn.danger{
  background:linear-gradient(90deg,#a51f42,#e35d3f);
}

.btn.success{
  background:linear-gradient(90deg,#16845c,#65b84b);
}

.btn.warning{
  background:linear-gradient(90deg,#bd7a18,#e6b83e);
}

.btn.small{
  width:auto;
  padding:9px 13px;
  margin:3px;
}

.center{
  text-align:center;
}

.welcome{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:100vh;
}

.welcomeBox{
  width:min(600px,100%);
  padding:25px;
  text-align:center;
  border-radius:24px;
  background:rgba(10,5,18,.78);
  border:1px solid rgba(255,255,255,.14);
  box-shadow:0 15px 60px rgba(0,0,0,.5);
}

.welcomeTitle{
  font-size:32px;
  font-weight:900;
  margin:10px 0;
}

.stats{
  margin:20px 0;
}

.statRow{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 5px;
  border-bottom:1px solid rgba(255,255,255,.08);
}

.statLabel{
  text-align:left;
  color:#ddd;
}

.statValue{
  font-weight:900;
  color:#f6d889;
}

.startDate{
  margin-top:20px;
  color:#aaa;
  font-size:13px;
}

.topbar{
  position:sticky;
  top:0;
  z-index:20;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px 14px;
  background:rgba(8,4,15,.92);
  border-bottom:1px solid rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
}

.topLogo{
  font-weight:900;
  letter-spacing:1px;
  animation:softColors 9s linear infinite;
}

.iconBtn{
  width:42px;
  height:42px;
  border-radius:11px;
  color:#fff;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.12);
  font-size:20px;
}

.profileHead{
  display:flex;
  gap:15px;
  align-items:center;
}

.avatar{
  width:70px;
  height:70px;
  border-radius:50%;
  object-fit:cover;
  border:2px solid #dcb56a;
  background:#21132f;
}

.profileName{
  font-size:22px;
  font-weight:bold;
}

.statusActive{
  color:#68e19b;
}

.statusInactive{
  color:#ff7777;
}

.statusPending{
  color:#f1c75b;
}

.miniGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-top:18px;
}

.miniBox{
  text-align:center;
  padding:12px 5px;
  border-radius:12px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.09);
}

.miniBox b{
  display:block;
  font-size:18px;
  color:#f5d584;
}

.miniBox span{
  font-size:10px;
  color:#aaa;
}

.menu{
  position:fixed;
  left:-290px;
  top:0;
  z-index:100;
  width:270px;
  height:100vh;
  padding:75px 15px 20px;
  background:#10091a;
  border-right:1px solid rgba(255,255,255,.12);

}

.menu.open{
  left:0;
}

.menu button{
  width:100%;
  padding:13px;
  margin:5px 0;
  text-align:left;
  color:#fff;
  background:rgba(255,255,255,.06);
  border-radius:10px;
}

.menu button:hover{
  background:rgba(255,255,255,.12);
}

.overlay{
  position:fixed;
  inset:0;
  z-index:90;
  background:rgba(0,0,0,.55);
}

.sectionTitle{
  text-align:center;
  margin-bottom:18px;
  font-size:25px;
}

.infoLine{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 0;
  border-bottom:1px solid rgba(255,255,255,.07);
}

.programGrid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.program{
  padding:15px;
  border-radius:15px;
  background:rgba(255,255,255,.055);
  border:1px solid rgba(255,255,255,.1);
}

.program h3{
  margin-bottom:8px;
}

.program p{
  color:#ccc;
  font-size:13px;
  margin:5px 0;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  margin:5px 0;
  border-radius:20px;
  font-size:11px;
  font-weight:bold;
}

.badge.green{
  color:#8affb6;
  background:rgba(34,170,100,.15);
}

.badge.red{
  color:#ff8b8b;
  background:rgba(220,50,50,.15);
}

.badge.yellow{
  color:#ffe18b;
  background:rgba(220,170,40,.15);
}

.badge.cyan{
  color:#86efff;
  background:rgba(40,190,210,.15);
}

.progress{
  width:100%;
  height:9px;
  margin:12px 0;
  overflow:hidden;
  border-radius:20px;
  background:#25152f;
}

.progressBar{
  height:100%;
  background:linear-gradient(90deg,#e2a935,#a864e9,#ed7cae);
  transition:.3s;
}

.levelBox{
  padding:13px;
  margin:8px 0;
  border-radius:12px;
  background:rgba(255,255,255,.05);
  display:flex;
  justify-content:space-between;
}

.tableWrap{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,td{
  padding:9px;
  border-bottom:1px solid rgba(255,255,255,.08);
  text-align:left;
  font-size:12px;
}

th{
  color:#e6c875;
}

.toast{
  position:fixed;
  right:15px;
  bottom:15px;
  z-index:200;
  max-width:330px;
  padding:13px 16px;
  border-radius:12px;
  background:#20132d;
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 8px 30px rgba(0,0,0,.4);
}

.modal{
  position:fixed;
  inset:0;
  z-index:150;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:15px;
  background:rgba(0,0,0,.72);
}

.modalBox{
  width:min(500px,100%);
  max-height:90vh;
  overflow:auto;
  padding:20px;
  border-radius:20px;
  background:#12091d;
  border:1px solid rgba(255,255,255,.13);
}

.activity{
  padding:15px;
  border-radius:13px;
  margin:10px 0;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
}

.notice{
  padding:13px;
  margin:8px 0;
  border-radius:12px;
  background:rgba(255,255,255,.05);
}

@media(max-width:600px){
  .programGrid{
    grid-template-columns:1fr;
  }

  .miniGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .welcomeTitle{
    font-size:25px;
  }
}
</style>
</head>

<body>

<div id="app"></div>

<div id="toast" class="toast hidden"></div>

<script>
/* =========================================================
   INNOVA.GLOBAL
   SINGLE FILE DEMO SYSTEM
   ========================================================= */

const DB = {
  users:"innova_users_final",
  payments:"innova_payments_final",
  withdrawals:"innova_withdrawals_final",
  history:"innova_history_final",
  notifications:"innova_notifications_final",
  current:"innova_current_final"
};

const PAYMENT_NUMBER="01313213083";
const JOINING_START="11 September 2026";

const programs=[
  {id:1,name:"INNOVA STARTER",price:100,reward:50},
  {id:2,name:"INNOVA BASIC",price:200,reward:100},
  {id:3,name:"INNOVA STANDARD",price:300,reward:150},
  {id:4,name:"INNOVA PREMIUM",price:400,reward:200},
  {id:5,name:"INNOVA ADVANCED",price:500,reward:250},
  {id:6,name:"INNOVA PRO",price:600,reward:300},
  {id:7,name:"INNOVA ELITE",price:700,reward:350},
  {id:8,name:"INNOVA VIP",price:800,reward:400}
];

const referralRewards={
  1:50,
  2:30,
  3:50,
  4:10
};

let users=load(DB.users,[]);
let payments=load(DB.payments,[]);
let withdrawals=load(DB.withdrawals,[]);
let histories=load(DB.history,[]);
let notifications=load(DB.notifications,[]);
let currentId=localStorage.getItem(DB.current)||null;

function load(key,def){
  try{
    return JSON.parse(localStorage.getItem(key)) ?? def;
  }catch(e){
    return def;
  }
}

function save(){
  localStorage.setItem(DB.users,JSON.stringify(users));
  localStorage.setItem(DB.payments,JSON.stringify(payments));
  localStorage.setItem(DB.withdrawals,JSON.stringify(withdrawals));
  localStorage.setItem(DB.history,JSON.stringify(histories));
  localStorage.setItem(DB.notifications,JSON.stringify(notifications));

  if(currentId){
    localStorage.setItem(DB.current,currentId);
  }else{
    localStorage.removeItem(DB.current);
  }
}

function uid(n){
  return String(n).padStart(3,"0");
}

function nextId(){
  if(users.length===0)return "001";

  let max=0;

  users.forEach(u=>{
    const n=parseInt(u.id)||0;
    if(n>max)max=n;
  });

  return uid(max+1);
}

function getUser(){
  return users.find(u=>u.id===currentId)||null;
}

function getUserById(id){
  return users.find(u=>u.id===id)||null;
}

function esc(v){
  return String(v??"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function now(){
  return new Date().toLocaleString();
}

function toast(message){
  const el=document.getElementById("toast");
  el.textContent=message;
  el.classList.remove("hidden");

  clearTimeout(window.toastTimer);

  window.toastTimer=setTimeout(()=>{
    el.classList.add("hidden");
  },3000);
}

function addHistory(userId,type,message,amount=0){
  histories.unshift({
    id:"H"+Date.now()+Math.random(),
    userId,
    type,
    message,
    amount,
    date:now()
  });
}

function addNotification(userId,message,type="SYSTEM"){
  notifications.unshift({
    id:"N"+Date.now()+Math.random(),
    userId,
    message,
    type,
    read:false,
    date:now()
  });
}

function descendants(userId){
  const result=[];

  function walk(id){
    users
      .filter(u=>u.upline===id)
      .forEach(child=>{
        result.push(child);
        walk(child.id);
      });
  }

  walk(userId);
  return result;
}

function directPartners(userId){
  return users.filter(u=>u.upline===userId);
}

function directReferralCount(userId){
  return directPartners(userId).filter(u=>u.status==="ACTIVE").length;
}

function teamCount(userId){
  return descendants(userId).length;
}

function todayCount(){
  const today=new Date().toDateString();

  return users.filter(u=>{
    return new Date(u.joinedAt).toDateString()===today;
  }).length;
}

function totalEarnings(){
  return users.reduce((sum,u)=>sum+(Number(u.earnings)||0),0);
}

/*
  Landing stats are real values from this local demo database.
  Before any registration:
  Partners = 0
  Earnings = 0
  Joining = 0
  Today = 0

  For a production website these values must come from
  a secure backend/database.
*/

function landingStats(){
  return {
    partners:Math.max(users.length-1,0),
    earnings:totalEarnings(),
    joining:users.length,
    today:todayCount()
  };
}

/* =========================================================
   WELCOME
   ========================================================= */

function welcomePage(){
  const s=landingStats();

  document.getElementById("app").innerHTML=`
  <div class="welcome page">

    <div class="welcomeBox">

      <div class="bismillah colorText">
        بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ
      </div>

      <div class="welcomeTitle colorText">
        ✨ WELCOME ✨
      </div>

      <div class="logo colorText">
        🌐 INNOVA.GLOBAL
      </div>

      <div class="subtitle colorText">
        WELCOME TO INNOVA.GLOBAL
      </div>

      <button class="btn" onclick="showRegister()">
        🚀 JOIN INNOVA.GLOBAL
      </button>

      <button class="btn secondary" onclick="showLogin()">
        🔐 LOGIN
      </button>

      <div style="margin-top:18px">

        <button class="btn secondary"
          onclick="window.open('https://www.youtube.com/@PowerNetwork7X','_blank')">
          📺 OFFICIAL YOUTUBE CHANNEL
        </button>

        <button class="btn secondary"
          onclick="window.open('https://t.me/powernetwork7xofficialchannel?livestream=6e9d38234ee3ebd233','_blank')">
          📢 OFFICIAL TELEGRAM CHANNEL
        </button>

        <button class="btn secondary"
          onclick="window.open('https://t.me/parvez7xtm','_blank')">
          👤 REAL ADMIN
        </button>

      </div>

      <div class="stats">

        <div class="statRow">
          <span class="statLabel">👥 TOTAL PARTNERS</span>
          <span id="wPartners" class="statValue">${uid(s.partners)}</span>
        </div>

        <div class="statRow">
          <span class="statLabel">💰 TOTAL EARNINGS</span>
          <span id="wEarnings" class="statValue">৳${s.earnings.toFixed(2)}</span>
        </div>

        <div class="statRow">
          <span class="statLabel">📝 TOTAL JOINING</span>
          <span id="wJoining" class="statValue">${uid(s.joining)}</span>
        </div>

        <div class="statRow">
          <span class="statLabel">📅 TODAY'S JOINING</span>
          <span id="wToday" class="statValue">${uid(s.today)}</span>
        </div>

      </div>

      <div class="startDate">
        JOINING STARTED — 11 September 2026
      </div>

    </div>

  </div>
  `;

  startWelcomeRefresh();
}

let welcomeTimer=null;

function startWelcomeRefresh(){
  clearInterval(welcomeTimer);

  welcomeTimer=setInterval(()=>{
    if(!document.getElementById("wPartners"))return;

    users=load(DB.users,[]);
    payments=load(DB.payments,[]);
    withdrawals=load(DB.withdrawals,[]);
    histories=load(DB.history,[]);
    notifications=load(DB.notifications,[]);

    const s=landingStats();

    document.getElementById("wPartners").textContent=uid(s.partners);
    document.getElementById("wEarnings").textContent="৳"+s.earnings.toFixed(2);
    document.getElementById("wJoining").textContent=uid(s.joining);
    document.getElementById("wToday").textContent=uid(s.today);

  },15000);
}

/* =========================================================
   REGISTER
   ========================================================= */

function showRegister(){
  const ref=new URLSearchParams(location.search).get("ref")||"";

  document.getElementById("app").innerHTML=`
  <div class="page">

    <div class="card">

      <div class="sectionTitle">
        🚀 JOIN INNOVA.GLOBAL
      </div>

      <label>Full Name</label>
      <input id="regName" placeholder="Enter your full name">

      <label>Mobile Number</label>
      <input id="regMobile" type="tel" placeholder="Enter mobile number">

      <label>Password</label>
      <input id="regPass" type="password" placeholder="Create password">

      <label>Referral ID</label>
      <input id="regRef"
             value="${esc(ref)}"
             placeholder="Example: 001">

      <button class="btn" onclick="register()">
        🚀 CREATE ACCOUNT
      </button>

      <button class="btn secondary" onclick="showLogin()">
        🔐 LOGIN
      </button>

      <button class="btn secondary" onclick="welcomePage()">
        ← BACK
      </button>

    </div>

  </div>
  `;
}

function register(){

  const name=document.getElementById("regName").value.trim();
  const mobile=document.getElementById("regMobile").value.trim();
  const pass=document.getElementById("regPass").value;
  let ref=document.getElementById("regRef").value.trim();

  if(!name||!mobile||!pass){
    toast("সব তথ্য পূরণ করুন।");
    return;
  }

  if(users.length===0){
    ref="";
  }else{
    ref=uid(parseInt(ref)||0);

    if(!getUserById(ref)){
      toast("Valid Referral ID দিন।");
      return;
    }
  }

  if(users.some(u=>u.mobile===mobile)){
    toast("এই Mobile Number দিয়ে account already আছে।");
    return;
  }

  const id=nextId();

  const isFirst=users.length===0;

  const user={
    id,
    name,
    mobile,
    password:pass,
    upline:ref||null,
    role:isFirst?"SUPER_ADMIN":"USER",

    status:isFirst?"ACTIVE":"INACTIVE",
    activated:isFirst,

    joinedAt:new Date().toISOString(),

    earnings:0,
    activityEarnings:0,
    referralEarnings:0,
    withdrawn:0,

    programs:{},

    profileImage:""
  };

  programs.forEach(p=>{
    user.programs[p.id]={
      active:isFirst,
      completed:0,
      running:false
    };
  });

  users.push(user);

  addHistory(
    id,
    "JOIN",
    "Account created",
    0
  );

  addNotification(
    id,
    "Welcome to INNOVA.GLOBAL.",
    "WELCOME"
  );

  if(ref){
    addNotification(
      ref,
      "New referral joined under your ID: "+id,
      "REFERRAL"
    );
  }

  currentId=id;

  save();

  toast("Account created. INNOVA ID: "+id);

  setTimeout(renderApp,500);
}

/* =========================================================
   LOGIN
   ========================================================= */

function showLogin(){

  document.getElementById("app").innerHTML=`
  <div class="page">

    <div class="card">

      <div class="sectionTitle">
        🔐 LOGIN
      </div>

      <label>INNOVA ID / Mobile</label>
      <input id="loginId"
             placeholder="001 অথবা mobile number">

      <label>Password</label>
      <input id="loginPass"
             type="password"
             placeholder="Enter password">

      <button class="btn" onclick="login()">
        🔐 LOGIN
      </button>

      <button class="btn secondary" onclick="showRegister()">
        🚀 JOIN INNOVA.GLOBAL
      </button>

      <button class="btn secondary" onclick="welcomePage()">
        ← BACK
      </button>

    </div>

  </div>
  `;
}

function login(){

  const id=document.getElementById("loginId").value.trim();
  const pass=document.getElementById("loginPass").value;

  const user=users.find(u=>
    u.id===id || u.mobile===id
  );

  if(!user || user.password!==pass){
    toast("ID/Mobile অথবা Password ভুল।");
    return;
  }

  currentId=user.id;
  save();

  renderApp();
}

/* =========================================================
   MAIN APP
   ========================================================= */

function renderApp(){

  const user=getUser();

  if(!user){
    welcomePage();
    return;
  }

  document.getElementById("app").innerHTML=`

  <div id="overlay"
       class="overlay hidden"
       onclick="closeMenu()"></div>

  <div id="sideMenu" class="menu">

    <button onclick="navigate('dashboard')">
      🏠 Dashboard
    </button>

    <button onclick="navigate('wallet')">
      💰 Wallet
    </button>

    <button onclick="navigate('history')">
      📜 History
    </button>

    <button onclick="navigate('notifications')">
      🔔 Notifications
    </button>

    <button onclick="navigate('team')">
      👥 Team
    </button>

    ${
      user.role==="SUPER_ADMIN"
      ?
      `<button onclick="navigate('admin')">
        👑 Admin Panel
      </button>`
      :""
    }

    <button onclick="logout()">
      🚪 Logout
    </button>

  </div>

  <div class="topbar">

    <button class="iconBtn" onclick="openMenu()">
      ☰

          </b>

          <div style="font-size:12px;color:#aaa;margin-top:5px">

/* =========================================================
   ACTIVITY
   ========================================================= */

function startActivity(programId){

  const u=getUser();
  const p=programs.find(x=>x.id===programId);

  if(!u||!p)return;

  const state=u.programs[p.id];

  if(state.completed>=12){
    toast("এই Program already completed.");
    return;
  }

  if(state.running){
    toast("Activity already running.");
    return;
  }

  state.running=true;
  save();

  let seconds=10;

  document.getElementById("mainContent").innerHTML=`

  <div class="page">

    <div class="card center">

      <h2>${p.name}</h2>

      <div class="activity">

        <h3>🎬 ACTIVITY ${state.completed+1}</h3>

        <p style="margin:12px 0;color:#aaa">
          Activity is running...
        </p>

        <h1 id="timer">${seconds}</h1>

        <div class="progress">
          <div id="activityProgress"
               class="progressBar"
               style="width:0%"></div>
        </div>

      </div>

    </div>

  </div>
  `;

  const total=seconds;

  const timer=setInterval(()=>{

    seconds--;

    const timerEl=document.getElementById("timer");
    const bar=document.getElementById("activityProgress");

    if(timerEl){
      timerEl.textContent=seconds;
    }

    if(bar){
      bar.style.width=
        ((total-seconds)/total*100)+"%";
    }

    if(seconds<=0){

      clearInterval(timer);

      state.running=false;
      state.completed++;

      /*
        Reward is recorded as configured/verified activity reward.
        In a real production system, this should only be credited
        after actual verified revenue/funding.
      */

      const reward=p.reward/12;

      u.earnings+=reward;
      u.activityEarnings+=reward;

      addHistory(
        u.id,
        "ACTIVITY",
        p.name+" Activity "+state.completed+" completed",
        reward
      );

      addNotification(
        u.id,
        "Activity "+state.completed+
        " completed. Verified reward recorded: ৳"+
        reward.toFixed(2),
        "EARNING"
      );

      save();

      toast(
        "Activity "+state.completed+
        " completed."
      );

      setTimeout(()=>{
        renderProgram(programId);
      },700);
    }

  },1000);
}

function saveSettings(){

    return;
  }

  if(file){

    const reader=new FileReader();

    reader.onload=function(e){

      renderProfile();
    };

/* =========================================================
   ADMIN PAYMENT APPROVE
   ========================================================= */

function approvePayment(paymentId){

  const p=payments.find(x=>x.id===paymentId);

  if(!p)return;

  const u=getUserById(p.userId);

  if(!u)return;

  p.status="APPROVED";
  p.approvedAt=now();

  if(p.type==="ID_ACTIVATION"){

    u.activated=true;
    u.status="ACTIVE";

    addHistory(
      u.id,
      "ID ACTIVATION",
      "INNOVA ID activated by admin",
      0
    );

    addNotification(
      u.id,
      "Your INNOVA ID activation payment was approved. Your ID is now ACTIVE.",
      "APPROVED"
    );

  }

  if(p.type==="PROGRAM_ACTIVATION"){

    if(!u.programs[p.packageId]){
      u.programs[p.packageId]={
        active:false,
        completed:0,
        running:false
      };
    }

    u.programs[p.packageId].active=true;

    addHistory(
      u.id,
      "PROGRAM ACTIVATION",
      p.packageName+" activated by admin",
      0
    );

    addNotification(
      u.id,
      p.packageName+" has been activated.",
      "APPROVED"
    );

  }

  save();

  toast("Payment approved.");

  renderAdmin();
}

function rejectPayment(paymentId){

  const p=payments.find(x=>x.id===paymentId);

  if(!p)return;

  p.status="REJECTED";
  p.rejectedAt=now();

  addNotification(
    p.userId,
    (
      p.packageName
      ?p.packageName+" activation"
      :"ID activation"
    )+
    " payment was rejected by admin.",
    "REJECTED"
  );

  addHistory(
    p.userId,
    "PAYMENT REJECTED",
    "Payment request rejected",
    0
  );

  save();

  toast("Payment rejected.");

  renderAdmin();
}

function approveWithdrawal(id){

  const w=withdrawals.find(x=>x.id===id);

  if(!w)return;

  const u=getUserById(w.userId);

  if(!u)return;

  if(w.status!=="PENDING"){
    toast("Already processed.");
    return;
  }

  if(Number(w.amount)>Number(u.earnings)){
    w.status="REJECTED";

    addNotification(
      u.id,
      "Withdrawal rejected because balance is insufficient.",
      "WITHDRAWAL"
    );

    save();
    renderAdmin();
    return;
  }

  u.earnings-=Number(w.amount);
  u.withdrawn+=Number(w.amount);

  w.status="APPROVED";
  w.approvedAt=now();

  addHistory(
    u.id,
    "WITHDRAWAL PAID",
    "Withdrawal approved and paid",
    -Number(w.amount)
  );

  addNotification(
    u.id,
    "Your withdrawal of ৳"+
    Number(w.amount).toFixed(2)+
    " was approved/paid.",
    "WITHDRAWAL"
  );

  save();

  toast("Withdrawal approved.");

  renderAdmin();
}

function rejectWithdrawal(id){

  const w=withdrawals.find(x=>x.id===id);

  if(!w)return;

  w.status="REJECTED";
  w.rejectedAt=now();

  addHistory(
    w.userId,
    "WITHDRAWAL REJECTED",
    "Withdrawal request rejected",
    0
  );

  addNotification(
    w.userId,
    "Your withdrawal request was rejected.",
    "WITHDRAWAL"
  );

  save();

  toast("Withdrawal rejected.");

  renderAdmin();
}

/* =========================================================
   REFERRAL REWARD CALCULATION
   =========================================================

   The structure is ready for verified referral rewards.

   Level 1 = 50
   Level 2 = 30
   Level 3 = 50
   Level 4 = 10

   Production version should calculate rewards only from
   legitimate, verified and funded transactions.
*/

function getUplineAtLevel(userId,level){

  let current=getUserById(userId);

  for(let i=0;i<level;i++){

    if(!current||!current.upline){
      return null;
    }

    current=getUserById(current.upline);
  }

  return current;
}

function recordVerifiedReferralReward(sourceUserId){

  const source=getUserById(sourceUserId);

  if(!source)return;

  for(let level=1;level<=4;level++){

    const up=getUplineAtLevel(
      sourceUserId,
      level
    );

    if(!up)break;

    const reward=referralRewards[level];

    up.earnings+=reward;
    up.referralEarnings+=reward;

    addHistory(
      up.id,
      "REFERRAL EARNING",
      "Verified Level "+level+
      " referral reward",
      reward
    );

    addNotification(
      up.id,
      "Verified Level "+level+
      " referral earning recorded: ৳"+
      reward.toFixed(2),
      "EARNING"
    );
  }

  save();
}
